[package]
name = "mechanics-core"
version = "0.6.0"
edition = "2024"
rust-version = "1.88"

authors = ["metastable-void"]
description = "mechanics automation framework (core)"
license = "Apache-2.0 OR MPL-2.0"
readme = "README.md"
repository = "https://github.com/metastable-void/mechanics-core"
homepage = "https://github.com/metastable-void/mechanics-core"
keywords = ["automation", "orchestration", "javascript", "worker-pool", "boa"]
categories = ["concurrency", "config", "api-bindings"]

[features]
default = ["rand", "encoding", "html", "console"]
rand = []
encoding = []
html = []
console = []

[dependencies]
boa_engine = { version = "0.21.0", default-features = false, features = ["float16", "temporal", "xsum"] } # kept: JS-runtime API contract — Temporal/Float16Array/Math.sumPrecise (stage-3+ proposals) must remain available to JS workloads even when no in-tree script grep-attests them. float16/xsum are boa's upstream defaults; temporal is mechanics-core's explicit extra. `intl` (ECMA-402) is wanted but blocked: boa 0.21 pins `icu_provider = "~2.0.0"` while the workspace's `url`/`idna_adapter`/`icu_normalizer` chain already locks `icu_provider 2.2.0` — version-unification conflict. Re-attempt when boa relaxes its icu tilde-constraint (typically a future minor release).
boa_gc = { version = "0.21.0", default-features = false, features = [] }
crossbeam-channel = { version = "0.5.15", default-features = false, features = ["std"] }
data-encoding = { version = "2.9.0", default-features = false, features = ["std"] }
futures-concurrency = { version = "7.7.1", default-features = false, features = ["std"] }
futures-lite = { version = "2.6.1", default-features = false, features = ["std"] }
getrandom = { version = "0.4.2", default-features = false, features = [] }
hex = { version = "0.4.3", default-features = false, features = ["std"] }
htmlize = { version = "1.1.0", default-features = false, features = ["unescape"] }
http = { version = "1", default-features = false, features = ["std"] }
mechanics-config = "0.1.0"
mechanics-http-client = { version = "0.2", default-features = false, features = ["http3"] } # kept: preserves opportunistic HTTP/3 endpoint transport
parking_lot = { version = "0.12.5", default-features = false, features = [] }
serde = { version = "1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.149", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
url = { version = "2.5.7", default-features = false, features = ["std"] }
uuid = { version = "1.18.1", default-features = false, features = ["std", "v3", "v4", "v5", "v6", "v7"] }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
overflow-checks = true
